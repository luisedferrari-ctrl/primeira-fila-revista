name: ENTRESSALA - preflight BABYMETAL sem publicacao
on:
  push:
    branches: [entressala-qa-babymetal-20261125]
    paths: ['instagram/extra-qa/ENTRESSALA-EXTRA-20261125-BABYMETAL/manifest.json']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entressala-qa-babymetal-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Run actual fail-closed preflight; no API calls
        run: |
          set +e
          python instagram/metricool_gate.py --manifest "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-BABYMETAL/manifest.json" --assets-root "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-BABYMETAL" --history instagram/image-history.json --report "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-BABYMETAL/report.json"
          code=$?
          set -e
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
          cat "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-BABYMETAL/report.json"
      - name: Commit preflight report only
        run: |
          git config user.name entressala-bot
          git config user.email entressala-bot@users.noreply.github.com
          git add "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-BABYMETAL/report.json"
          git diff --cached --quiet || (git commit -m "Record real BABYMETAL preflight result, no publication" && git push origin HEAD:entressala-qa-babymetal-20261125)

name: ENTRESSALA - Metricool Extra Policy QA (offline)
on:
  push:
    branches: [entressala-piloto-2026-11]
    paths:
      - 'instagram/metricool_gate.py'
      - 'instagram/test_metricool_gate.py'
      - 'instagram/metricool-gate-v1.md'
      - '.github/workflows/entressala-metricool-gate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline QA dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Compile gate (no media publication)
        run: python -m py_compile instagram/metricool_gate.py instagram/test_metricool_gate.py
      - name: Run fail-closed synthetic cases
        run: python -m unittest discover -s instagram -p 'test_metricool_gate.py' -v

name: ENTRESSALA - Imagens reais do Instagram
on:
  workflow_dispatch:
  schedule:
    - cron: '27 15 * * *' # diario 12:27 BRT, inclusive depois da primeira semana
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Usar branch editorial sem alterar o site publico
        uses: actions/checkout@v4
        with:
          ref: entressala-piloto-2026-11
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de imagem
        run: pip install --disable-pip-version-check pillow requests
      - name: Fotografias Wikimedia e composicao com credito
        run: python instagram/render_social.py
      - name: Publicar apenas novos arquivos na branch editorial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram/assets instagram/fila-publicavel.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(entressala): render instagram photos licensed and credited'
            git push origin HEAD:entressala-piloto-2026-11
          fi
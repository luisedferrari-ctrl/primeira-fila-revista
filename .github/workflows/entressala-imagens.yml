name: ENTRESSALA - Imagens reais do Instagram
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entressala-imagens.yml'
  schedule:
    - cron: '27 15 * * *' # diario 12:27 BRT, inclusive depois da primeira semana
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Usar branch editorial sem alterar o site publico
        uses: actions/checkout@v4
        with:
          ref: entressala-piloto-2026-11
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de imagem
        run: pip install --disable-pip-version-check pillow requests
      - name: Validar sintaxe e manifests editoriais
        run: |
          python -m py_compile instagram/render_social.py
          python -m json.tool instagram/fila-editorial.json > /dev/null
          python -m json.tool instagram/image-history.json > /dev/null
      - name: Testes de politica editorial e fotos ineditas (sem rede)
        run: python -m unittest discover -s instagram -p 'test_image_policy.py' -v
      - name: Renderizar fotografias e cartazes autorizados com protecao antirreuso
        run: python instagram/render_social.py
      - name: Publicar apenas novos arquivos na branch editorial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram/assets instagram/fila-publicavel.json instagram/image-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(entressala): render instagram photos licensed and credited'
            # A pauta pode ter sido atualizada enquanto o renderizador buscava fotos.
            git fetch origin entressala-piloto-2026-11
            git rebase origin/entressala-piloto-2026-11
            git push origin HEAD:entressala-piloto-2026-11
          fi
name: ENTRESSALA - QA isolado Cliff Booth
on:
  push:
    branches: [entressala-qa-cliff-booth-20261125]
    paths:
      - 'instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/prepare.py'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entressala-qa-cliff-booth-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Prepare licensed image and execute fail-closed gate
        run: python instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/prepare.py
      - name: Archive actual candidate and blocked gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entressala-cliff-booth-qa
          path: instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/
      - name: Save candidate and evidence to isolated branch only
        if: success()
        run: |
          git config user.name "entressala-bot"
          git config user.email "entressala-bot@users.noreply.github.com"
          git add "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/01.jpg" "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/original.jpg" "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/preview.jpg" "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/manifest.json" "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/report.json" "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/legenda.txt" "instagram/extra-qa/ENTRESSALA-EXTRA-20261125-CLIFF-BOOTH/EVIDENCIAS.md"
          git diff --cached --quiet || (git commit -m "QA candidate Cliff Booth - blocked pending independent review" && git push origin HEAD:entressala-qa-cliff-booth-20261125)
